name: Generate ElevenLabs sound effects

on:
  push:
    branches:
      - claude/eleven-labs-api-integration-knaywq
    paths:
      - 'scripts/generate-sfx.mjs'
      - '.github/workflows/generate-sfx.yml'
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Regenerate all sound effects even if already present'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate sound effects
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLAB }}
          FORCE_REGENERATE: ${{ github.event.inputs.force_regenerate }}
        run: node scripts/generate-sfx.mjs

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/audio/sfx
          if git diff --cached --quiet; then
            echo "No new or changed sound effects to commit."
          else
            git commit -m "Generate sound effects with ElevenLabs"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
